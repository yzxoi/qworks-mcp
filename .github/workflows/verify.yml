name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jupyter_server>=2,<3' 'ipykernel>=6,<7'
      - run: npm run verify
        env:
          CONTENT_DENY_PATTERNS: ${{ secrets.CONTENT_DENY_PATTERNS }}
          REQUIRE_CONTENT_POLICY: 'true'
          QWORKS_REQUIRE_JUPYTER_TESTS: '1'
      - run: npm run doctor
